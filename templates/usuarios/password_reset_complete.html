<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña actualizada · Bistro Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #1c1c1c, #2d2d2d, #1c1c1c);
            min-height: 100vh;
        }
        .card {
            border-radius: 20px;
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(to right, #c0392b, #e74c3c);
            padding: 2.5rem;
            text-align: center;
        }
        .icon-circle {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: #fff;
        }
        .btn-ingresar {
            background: linear-gradient(to right, #c0392b, #e74c3c);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-ingresar:hover {
            background: linear-gradient(to right, #a93226, #cb4335);
            transform: translateY(-1px);
        }
    </style>
</head>

<body class="d-flex align-items-center">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">

                <div class="card shadow-lg border-0">

                    <div class="card-header-custom">
                        <div class="icon-circle">
                            <i class="bi bi-check-lg"></i>
                        </div>
                        <h2 class="fw-bold text-white mb-1">¡Listo!</h2>
                        <p class="text-white-50 mb-0 small">Contraseña actualizada correctamente</p>
                    </div>

                    <div class="card-body p-4 p-lg-5 bg-white text-center">
                        <p class="text-muted mb-4">
                            Tu contraseña ha sido cambiada exitosamente. Ya puedes iniciar sesión con tu nueva contraseña.
                        </p>
                        <div class="d-grid">
                            <a href="{% url 'login' %}" class="btn btn-ingresar text-white btn-lg fw-bold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                            </a>
                        </div>
                    </div>

                </div>

                <p class="text-center text-white-50 small mt-4">
                    © 2026 Bistro Master · Todos los derechos reservados
                </p>

            </div>
        </div>
    </div>
</body>
</html>
