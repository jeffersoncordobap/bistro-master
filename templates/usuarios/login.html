<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Iniciar sesión
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background: linear-gradient(to right, #141e30, #243b55);">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

                    <div class="bg-dark text-white text-center p-4">

                        <h2 class="fw-bold">
                            Bistro Master
                        </h2>

                        <p class="mb-0">
                            Inicia sesión en tu restaurante
                        </p>

                    </div>

                    <div class="card-body p-5">

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-danger">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Usuario

                                </label>

                                {{ form.username }}

                            </div>

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Contraseña

                                </label>

                                {{ form.password }}

                            </div>

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg fw-bold">

                                    Iniciar sesión

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
