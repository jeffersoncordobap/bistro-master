<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Bistro Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1c1c1c, #2d2d2d, #1c1c1c);
            min-height: 100vh;
        }
        .card {
            border-radius: 20px;
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(to right, #c0392b, #e74c3c);
            padding: 2.5rem;
            text-align: center;
        }
        .btn-login {
            background: linear-gradient(to right, #c0392b, #e74c3c);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn-login:hover {
            background: linear-gradient(to right, #a93226, #cb4335);
            transform: translateY(-1px);
            transition: all 0.2s;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.15);
            border-color: #e74c3c;
        }
        .input-group-text {
            border-radius: 10px 0 0 10px;
            background: #f8f9fa;
            border-right: none;
        }
    </style>
    <style>
        /* Ajustes móviles: hacer la tarjeta más compacta */
        @media (max-width: 768px) {
            body {
                padding-top: 0rem;
                padding-bottom: 0.5rem;
                min-height: 100vh;
                background: linear-gradient(135deg, #1c1c1c, #2d2d2d);
                display: flex;
                align-items: center;
                justify-content: center;
            }
           .container.py-5 { 
                padding-top: 0 !important; 
                padding-bottom: 0 !important; 
                width: 100%;
            }
            .card {
                border-radius: 14px;
                margin: 0.25rem;
            }
            .card-header-custom {
                padding: 1rem 1rem;
            }
            .card-header-custom .fs-1 { font-size: 2rem; }
            .card-body { padding: 0.85rem 1rem; }
            .btn-login { padding: 10px; font-size: 0.95rem; }
            .form-control { padding: 10px 12px; }
            .card .text-center { margin-top: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow-lg border-0">

                    <div class="card-header-custom">
                        <i class="bi bi-cup-hot-fill text-white fs-1 mb-2 d-block"></i>
                        <h2 class="fw-bold text-white mb-1">Bistro Master</h2>
                        <p class="text-white-50 mb-0 small">Inicia sesión en tu restaurante</p>
                    </div>

                    <div class="card-body p-4 p-lg-5 bg-white">

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger rounded-3 d-flex align-items-center gap-2">
                                    <i class="bi bi-exclamation-circle-fill"></i>
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person text-muted"></i>
                                    </span>
                                    {{ form.username }}
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold text-dark">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock text-muted"></i>
                                    </span>
                                    {{ form.password }}
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-login text-white btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>
                                    Iniciar sesión
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="{% url 'password_reset' %}" class="text-decoration-none text-danger small">
                                    ¿Olvidaste tu contraseña?
                                </a>
                            </div>

                        </form>
                    </div>

                </div>

                <p class="text-center text-white-50 small mt-4">
                    © 2026 Bistro Master · Todos los derechos reservados
                </p>

            </div>
        </div>
    </div>
</body>
</html>
