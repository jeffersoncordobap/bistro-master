<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña · Bistro Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #1c1c1c, #2d2d2d, #1c1c1c);
            min-height: 100vh;
        }
        .card {
            border-radius: 20px;
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(to right, #c0392b, #e74c3c);
            padding: 2.5rem;
            text-align: center;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(192,57,43,0.15);
            border-color: #e74c3c;
        }
        .btn-enviar {
            background: linear-gradient(to right, #c0392b, #e74c3c);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .btn-enviar:hover {
            background: linear-gradient(to right, #a93226, #cb4335);
            transform: translateY(-1px);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #343a40;
        }
    </style>
</head>

<body class="d-flex align-items-center">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">

                <div class="card shadow-lg border-0">

                    <div class="card-header-custom">
                        <i class="bi bi-lock-fill text-white fs-1 mb-2 d-block"></i>
                        <h2 class="fw-bold text-white mb-1">Recuperar contraseña</h2>
                        <p class="text-white-50 mb-0 small">Te enviaremos un enlace a tu correo</p>
                    </div>

                    <div class="card-body p-4 p-lg-5 bg-white">
                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-4">
                                <label class="form-label">Correo electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0" style="border-radius: 10px 0 0 10px;">
                                        <i class="bi bi-envelope text-muted"></i>
                                    </span>
                                    {{ form.email }}
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-enviar text-white btn-lg">
                                    <i class="bi bi-send me-2"></i>Enviar enlace
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="{% url 'login' %}" class="text-decoration-none text-danger small">
                                    Volver al inicio de sesión
                                </a>
                            </div>

                        </form>
                    </div>

                </div>

                <p class="text-center text-white-50 small mt-4">
                    © 2026 Bistro Master · Todos los derechos reservados
                </p>

            </div>
        </div>
    </div>
</body>
</html>
