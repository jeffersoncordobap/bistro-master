<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel Mesero{% endblock %} · Bistro Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --rojo:      #e74c3c;
            --rojo-dark: #c0392b;
            --sidebar-w: 230px;
        }

        body {
            background: #f8f9fa;
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            color: #1f2937;
        }

        .bm-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: linear-gradient(to bottom, #c0392b, #e74c3c);
            display: flex;
            flex-direction: column;
            padding: 1.75rem 1rem;
            z-index: 100;
            overflow-y: auto;
        }

        .bm-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .bm-brand i {
            font-size: 1.4rem;
        }

        .bm-nav {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .bm-nav .nav-section-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.5);
            padding: 0.9rem 0.6rem 0.3rem;
            font-weight: 600;
        }

        .bm-nav a {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 0.85rem;
            border-radius: 10px;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }

        .bm-nav a:hover,
        .bm-nav a.active {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }

        .bm-nav a i {
            font-size: 1rem;
            width: 18px;
            text-align: center;
            opacity: 0.85;
        }

        .bm-nav .logout-item {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .bm-nav .logout-item a {
            color: rgba(255,255,255,0.7);
        }

        .bm-nav .logout-item a:hover {
            background: rgba(0,0,0,0.15);
            color: #fff;
        }

        .bm-main {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bm-topbar {
            background: #fff5f5;
            border-bottom: 1px solid #f1d0d0;
            padding: 0.5rem 1.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            gap: 0.5rem;
            box-sizing: border-box;
            height: auto;
            min-height: 56px;
            flex-wrap: wrap;
        }

        .bm-topbar h2 {
            font-size: clamp(0.95rem, 2.8vw, 1.15rem);
            font-weight: 700;
            margin: 0;
            color: var(--rojo);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .bm-user-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 100px;
            padding: 0.3rem 0.9rem 0.3rem 0.4rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #495057;
            flex-shrink: 0;
            max-width: 45%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bm-user-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--rojo-dark), var(--rojo));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .bm-content {
            padding: 1.75rem;
            flex: 1;
        }

        .bm-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--rojo);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            flex-shrink: 0;
        }

        .bm-sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }

        .bm-sidebar-overlay.active {
            display: block;
        }

        @media (max-width: 768px) {

            .bm-sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: var(--sidebar-w);
                height: 100vh;
                transform: translateX(-100%);
                transition: transform 0.3s;
                z-index: 101;
            }

            .bm-sidebar.active {
                transform: translateX(0);
            }

            .bm-menu-toggle {
                display: block;
            }

            .bm-main {
                margin-left: 0;
            }

            .bm-topbar {
                padding: 0.45rem 1rem;
                gap: 0.5rem;
            }

            .bm-topbar h2 {
                font-size: clamp(0.9rem,3.5vw,1.05rem);
                flex: 1;
                min-width: 0;
            }

            .bm-user-badge {
                margin-left: auto;
                font-size: 0.78rem;
                padding: 0.22rem 0.7rem 0.22rem 0.28rem;
                max-width: 40%;
            }

            .bm-user-avatar {
                width: 24px;
                height: 24px;
                font-size: 0.65rem;
            }

            .bm-content {
                padding: 1rem;
            }

            .bm-flash-alert {
                padding: 0.4rem 0.55rem;
                font-size: 0.76rem;
                gap: 0.35rem;
                margin-bottom: 1.5rem;
                border-radius: 10px !important;
                flex-wrap: nowrap;
                align-items: center;
            }

            .bm-flash-alert > i {
                font-size: 0.82rem;
                flex-shrink: 0;
            }

            .bm-flash-alert .bm-alert-msg {
                flex: 1;
                min-width: 0;
                white-space: nowrap;
                line-height: 1.2;
            }

            .bm-flash-alert .btn-close {
                flex-shrink: 0;
                padding: 0.35rem;
                margin: 0 0 0 0.15rem;
                font-size: 0.65rem;
                position: relative;
                top: 2px;
            }

            .bm-nav .logout-item {
                margin-top: 30rem;
                padding-top: 0.75rem;
            }
        }

        .bm-flash-alert {
            margin-bottom: 1.5rem;
        }

        .bm-flash-alert .bm-alert-msg {
            line-height: 1.35;
        }
    </style>
</head>

<body>

    <div class="bm-sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR MESERO -->
    <aside class="bm-sidebar" id="bmSidebar">

        <a href="{% url 'panel_mesero' %}" class="bm-brand">
            <i class="bi bi-cup-hot-fill"></i> Bistro Master
        </a>

        <ul class="bm-nav">

            <li class="nav-section-label">Mi panel</li>

            <li>
                <a href="{% url 'panel_mesero' %}">
                    <i class="bi bi-speedometer2"></i> Inicio
                </a>
            </li>

            <li>
                <a href="{% url 'registrar_comanda' %}">
                    <i class="bi bi-plus-circle"></i> Nueva comanda
                </a>
            </li>

            <li>
                <a href="{% url 'mis_comandas' %}">
                    <i class="bi bi-clock-history"></i> Mis comandas
                </a>
            </li>

            <li class="logout-item">
                <a href="{% url 'logout' %}">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                </a>
            </li>

        </ul>

    </aside>

    <!-- MAIN -->
    <div class="bm-main">

        <header class="bm-topbar">

            <div style="display:flex; align-items:center; gap:0.75rem; flex:1; min-width:0;">

                <button class="bm-menu-toggle" id="menuToggle" aria-label="Menú">
                    <i class="bi bi-list"></i>
                </button>

                <h2>{% block page_title %}Panel{% endblock %}</h2>

            </div>

            <div class="bm-user-badge">

                <div class="bm-user-avatar">
                    {{ request.user.username|slice:":1"|upper }}
                </div>

                {{ request.user.username }}

            </div>

        </header>

        <main class="bm-content">

            {% block content %}{% endblock %}

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const path = window.location.pathname;

        document.querySelectorAll('.bm-nav a').forEach(a => {

            const href = a.getAttribute('href');

            if (href && href !== '#' && path.startsWith(href)) {
                a.classList.add('active');
            }

        });

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('bmSidebar');
        const overlay = document.getElementById('sidebarOverlay');

        if (menuToggle) {

            menuToggle.addEventListener('click', () => {

                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');

            });

        }

        if (overlay) {

            overlay.addEventListener('click', () => {

                sidebar.classList.remove('active');
                overlay.classList.remove('active');

            });

        }

        document.querySelectorAll('.bm-nav a').forEach(link => {

            link.addEventListener('click', () => {

                sidebar.classList.remove('active');
                overlay.classList.remove('active');

            });

        });

    </script>

</body>
</html>
